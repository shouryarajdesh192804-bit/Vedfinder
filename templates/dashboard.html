<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Dashboard | VedFinder

</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/dashboard.css') }}">

<link rel="icon"
href="{{ url_for('static', filename='images/favicon.png') }}">

</head>

<body>

<div class="dashboard">

<div class="sidebar">

<img
src="{{ url_for('static', filename='images/logo.png') }}"
class="logo">

<h2>

VedFinder

</h2>

<p>

by Guru

</p>

<a href="{{ url_for('home') }}">

🏠 Home

</a>

<a href="{{ url_for('settings') }}">

⚙ Settings

</a>

<a href="{{ url_for('logout') }}">

🚪 Logout

</a>

</div>

<div class="content">

<h1>

Welcome,

{{ username }}

</h1>

<h2>

Recent Searches

</h2>

{% if history %}

<div class="history">

{% for item in history %}

<div class="history-card">

<p>

{{ item }}

</p>

</div>

{% endfor %}

</div>

{% else %}

<p>

No searches yet.

</p>

{% endif %}

</div>

</div>

</body>

</html>
