<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

VedFinder Login

</title>

<link
rel="icon"
href="{{ url_for('static', filename='images/favicon.png') }}">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="login-container">

<div class="login-card">

<img

src="{{ url_for('static', filename='images/logo.png') }}"

class="logo"

alt="VedFinder">

<h1>

VedFinder

</h1>

<p>

by Guru

</p>

{% with messages=get_flashed_messages() %}

{% if messages %}

<div class="flash">

{% for message in messages %}

<p>

{{ message }}

</p>

{% endfor %}

</div>

{% endif %}

{% endwith %}

<form

action="{{ url_for('login') }}"

method="POST">

<input

type="text"

name="username"

placeholder="Username"

required>

<input

type="password"

name="password"

placeholder="Password"

required>

<button

type="submit">

Login

</button>

</form>

<div class="links">

<a

href="{{ url_for('signup') }}">

Create Account

</a>

|

<a

href="{{ url_for('home') }}">

Back to Search

</a>

</div>

</div>

</div>

</body>

</html>
